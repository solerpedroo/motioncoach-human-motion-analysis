[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "motioncoach"
version = "0.1.0"
description = "Shared contracts for observable human motion analysis"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.12,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.119,<1", "uvicorn>=0.37,<1"]

[dependency-groups]
dev = [
    "httpx>=0.28,<1",
    "jsonschema>=4.25,<5",
    "pytest>=8.4,<10",
    "rfc3339-validator>=0.1.4,<1",
    "ruff>=0.14,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["motioncoach", "backend"]

[tool.pytest.ini_options]
testpaths = ["motioncoach/tests", "backend/tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
